<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      main{
        width: 1200px;
        height: auto;
        background-color: #e31e63;
        margin: auto;

        display: grid;
        grid-template-columns: 100px 200px 300px 400px;
      } 
    
        @media screen and (max-width: 1200px) {
            main {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            gap:20px;
            }
            
        }
    
    
    
        @media screen and (max-width: 1200px) {
            main {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            gap:20px;
            }
            
        }
    
    
        @media screen and (max-width: 1200px) {
            main {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            gap:20px;
            }
            
        }
    
    </style>
</head>
<body>
    <main>
        <div style="background-color: yellow; height: 100px;">1</div>
        <div style="background-color: green; height: 100px;">2</div>
        <div style="background-color: blue; height: 100px;">3</div>
        <div style="background-color: purple; height: 100px;">4</div>
    </main>

    
</body>
</html>
